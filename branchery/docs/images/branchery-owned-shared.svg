<text x="371" y="336" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">13-4.blog.ddev.site</text>
<text x="371" y="360" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">php 8.4</text>
<text x="371" y="384" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">branchery_13_4</text>

<rect x="610" y="268" width="239" height="140" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
<text x="630" y="302" fill="var(--text-primary, #1C1A17)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="16" font-weight="600">11.5</text>
<text x="630" y="336" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">11-5.blog.ddev.site</text>
<text x="630" y="360" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">php 7.4</text>
<text x="630" y="384" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13">branchery_11_5</text>

