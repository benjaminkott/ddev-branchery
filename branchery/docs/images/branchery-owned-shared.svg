<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="os-t os-d">
<title id="os-t">A worktree owns what makes it separate</title>
<desc id="os-d">Inside one DDEV project: the original project keeps its address, its PHP version and its database, and every worktree has its own beside it. Underneath, held once for all of them, are the git object store, the project's web container with git, Composer, Node and the database client, and the database server the worktree databases live on.</desc>
<rect width="1200" height="780" fill="var(--surface-canvas, #FBFAF7)"></rect>

<text x="60" y="60" fill="var(--accent, #FF8700)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" font-weight="600" letter-spacing="1.6">OWNED · SHARED</text>
<text x="60" y="108" fill="var(--text-primary, #1C1A17)" font-family="'Source Sans 3',system-ui,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5">A worktree owns what makes it separate</text>
<text x="60" y="140" fill="var(--text-secondary, #4A453D)" font-family="'Source Sans 3',system-ui,sans-serif" font-size="17">An address, a PHP pool, a checkout and a database belong to one worktree. What is expensive is the project's, held once.</text>
<line x1="60" y1="176" x2="1140" y2="176" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></line>

<rect x="60" y="210" width="1080" height="430" rx="6" fill="none" stroke="var(--border-strong, #C9C3B7)" stroke-width="1.5"></rect>
<text x="92" y="244" fill="var(--text-muted, #726C63)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" letter-spacing="0.8">ONE DDEV PROJECT</text>

<rect x="92" y="268" width="239" height="140" rx="6" fill="var(--text-primary, #1C1A17)"></rect>
<text x="112" y="302" fill="var(--surface-canvas, #FBFAF7)" font-family="'Source Sans 3',system-ui,sans-serif" font-size="16" font-weight="700">the project</text>
<text x="112" y="336" fill="var(--surface-canvas, #FBFAF7)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" opacity="0.72">blog.ddev.site</text>
<text x="112" y="360" fill="var(--surface-canvas, #FBFAF7)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" opacity="0.72">php 8.3</text>
<text x="112" y="384" fill="var(--surface-canvas, #FBFAF7)" font-family="'Source Code Pro',ui-monospace,monospace" font-size="13" opacity="0.72">db</text>

<rect x="351" y="268" width="239" height="140" rx="6" fill="var(--surface-raised, #FFFFFF)" stroke="var(--border-subtle, #E3DFD6)" stroke-width="1"></rect>
