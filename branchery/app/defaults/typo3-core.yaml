# The TYPO3 core repository (typo3/typo3), served from its own root.
#
# What "profile: typo3-core" pulls in. Where it differs from typo3-app: the root
# is the docroot, the settings file lives under typo3conf, and both versions it
# builds with are the ones the branch names itself.

docroot: ''
bin: bin
backend: /typo3

# Taken out of the checkout rather than written down: a core branch says it in
# its own test runner, and that is what the branch is built against.
php:
  read: Build/Scripts/runTests.sh
  match: 'PHP_VERSION="(\d+\.\d+)"'

# And the Node version, out of the file the core keeps it in. Said here rather
# than left to be found: that file is under Build/, and what reads a checkout's
# own version reads from its root.
node:
  read: Build/.nvmrc
  match: 'v?(\d+(?:\.\d+)*)'

# Both known because this configuration is that repository and nothing else.
# The review is asked for by Change-Id: the change number is Gerrit's own and is
# nowhere in the commit.
links:
  review: https://review.typo3.org/q/{change}
  issue: https://forge.typo3.org/issues/{issue}
  commit: https://github.com/TYPO3/typo3/commit/{commit}

data:
  from: source
  bring:
    - typo3conf/sites
    - typo3conf/system/settings.php
  addresses:
    - typo3conf/sites

copy:
  except:
    - var
    - typo3temp
    - .vscode
    - .idea

# Both halves of the toolchain. Work on the core happens under Build/ as much as
# under typo3/, and a worktree without them is one where the first "grunt build"
# fails on a missing binary. Installed here rather than carried over, so a
# worktree checked out from a branch is as complete as one forked.
#
# What is not here: the containers Build/Scripts/runTests.sh starts -- it brings
# its own PHP and database, and the functional tests never see this worktree's.
#
# The npm half is optional, and that is not a shrug: a branch whose
# Build/package-lock.json predates the npm this container brings cannot be
# installed at all, and every one of those is a branch whose work is PHP.
install:
  - $BRANCHERY_PHP /usr/local/bin/composer install --no-interaction --no-progress
  - exec: cd Build && npm ci --no-audit --no-fund
    optional: true

# Under typo3conf/ and already ignored in the core repository, so this file
# shows up in no patch.
configure:
  - |
    mkdir -p typo3conf/system
    cat > typo3conf/system/additional.php <<PHP
    <?php

    // Generated by the worktree management.

    declare(strict_types=1);

    // This worktree's own database on the project's server.
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['driver'] = '$BRANCHERY_DB_DRIVER';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['host'] = '$BRANCHERY_DB_HOST';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['port'] = $BRANCHERY_DB_PORT;
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['user'] = '$BRANCHERY_DB_USER';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['password'] = '$BRANCHERY_DB_PASSWORD';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['dbname'] = '$BRANCHERY_DATABASE';

    putenv('BRANCHERY_NAME=$BRANCHERY_NAME');
    putenv('BRANCHERY_HOST=$BRANCHERY_HOST');
    putenv('BRANCHERY_URL=$BRANCHERY_URL');

    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['trustedHostsPattern'] = '$BRANCHERY_HOSTS_PATTERN';
    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['sitename'] = '$BRANCHERY_NAME';

    // Development defaults
    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['displayErrors'] = 1;
    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['devIPmask'] = '*';
    \$GLOBALS['TYPO3_CONF_VARS']['BE']['debug'] = true;
    \$GLOBALS['TYPO3_CONF_VARS']['FE']['debug'] = true;

    // Mail ends up in Mailpit (ddev mailpit)
    \$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport'] = 'smtp';
    \$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport_smtp_server'] = 'localhost:1025';
    \$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport_smtp_encrypt'] = false;
    PHP

setup:
  - |
    "$BRANCHERY_PHP" "$BRANCHERY_BIN/typo3" setup \
      --driver="$BRANCHERY_DB_DRIVER" --host="$BRANCHERY_DB_HOST" --port="$BRANCHERY_DB_PORT" \
      --username="$BRANCHERY_DB_USER" --password="$BRANCHERY_DB_PASSWORD" --dbname="$BRANCHERY_DATABASE" \
      --admin-username="$BRANCHERY_ADMIN_USER" --admin-user-password="$BRANCHERY_ADMIN_PASSWORD" \
      --admin-email="$BRANCHERY_ADMIN_EMAIL" \
      --project-name="$BRANCHERY_NAME" --create-site="$BRANCHERY_URL" \
      --server-type=apache --force --no-interaction

migrate:
  - $BRANCHERY_PHP $BRANCHERY_BIN/typo3 extension:setup

# The last step of every operation that touches a worktree: a build, a data
# sync, a version switch, a bare reconfiguration.
finish:
  - $BRANCHERY_PHP $BRANCHERY_BIN/typo3 cache:flush
