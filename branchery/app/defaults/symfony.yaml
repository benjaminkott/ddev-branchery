# A Symfony application.
#
# What "profile: symfony" pulls in. The schema here is the one a project with
# doctrine/doctrine-migrations-bundle has; a project that keeps no migrations
# replaces setup and migrate with "doctrine:schema:update --force --complete",
# and one with neither replaces them with nothing.

docroot: public

data:
  from: source

# A fork copies over everything git ignores -- vendor, .env, uploads -- which
# is what makes it run without a build. Not these: what a run left behind was
# left behind for the code it ran on.
copy:
  except:
    - var
    - .vscode
    - .idea

install:
  - $BRANCHERY_PHP /usr/local/bin/composer install --no-interaction --no-progress

# .env.dev.local and not .env.local: the latter is the project's own file,
# unversioned and carried over when branching off, and it holds settings that
# have nothing to do with a worktree. Symfony reads this one after it, so one
# line is added and nothing of the project's is lost.
configure:
  - |
    cat > .env.dev.local <<ENV
    APP_ENV=dev
    APP_DEBUG=1
    DATABASE_URL="$BRANCHERY_DB_URL"
    ENV

setup:
  - $BRANCHERY_PHP bin/console doctrine:database:create --if-not-exists --no-interaction
  - $BRANCHERY_PHP bin/console doctrine:migrations:migrate --allow-no-migration --no-interaction

migrate:
  - $BRANCHERY_PHP bin/console doctrine:migrations:migrate --allow-no-migration --no-interaction

# The last step of every operation that touches a worktree: a build, a data
# sync, a version switch, a bare reconfiguration.
finish:
  - $BRANCHERY_PHP bin/console cache:clear
