# A TYPO3 instance, or an extension that builds one.
#
# What "profile: typo3-app" pulls in. Everything a project writes beside it is
# laid over it -- a moment written as before/after keeps what is here, one
# written as a list replaces it.
#
# Every line runs in the worktree, in the project's web container, through a
# shell. What it needs to know is in the environment: BRANCHERY_PHP is the
# interpreter, BRANCHERY_BIN where the project's binaries are, and the
# connection to this worktree's own database is BRANCHERY_DB_*.

docroot: public
backend: /typo3

# The data of the checkout this worktree was cut from, and what has to travel
# with it in order to be readable: a site points at its root page by uid, and
# an application without a settings file is an installer with no console.
data:
  from: source
  bring:
    - config/sites
    - config/system/settings.php
  addresses:
    - config/sites

# What a run leaves behind stays behind. `var` above all: the compiled
# container is built for the code it was built from. What is not left behind:
# the tools' configuration, which is a setting of the project and wanted in
# every worktree of it, the way .env is.
copy:
  except:
    - var
    - typo3temp
    - .vscode
    - .idea

install:
  - $BRANCHERY_PHP /usr/local/bin/composer install --no-interaction --no-progress

# Said in the file Branchery owns, so an installation that rewrites its own
# settings cannot leave the worktree without a database. Written key by key:
# what the installation put beside it stays.
#
# The address goes into the environment as well, which is what lets a project
# keep its site configuration under version control and still be served at
# every worktree's own address: TYPO3 resolves %env(BRANCHERY_HOST)% in
# config.yaml, and this file is loaded before any site is read.
configure:
  - |
    mkdir -p config/system
    cat > config/system/additional.php <<PHP
    <?php

    // Generated by the worktree management.

    declare(strict_types=1);

    // This worktree's own database on the project's server.
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['driver'] = '$BRANCHERY_DB_DRIVER';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['host'] = '$BRANCHERY_DB_HOST';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['port'] = $BRANCHERY_DB_PORT;
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['user'] = '$BRANCHERY_DB_USER';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['password'] = '$BRANCHERY_DB_PASSWORD';
    \$GLOBALS['TYPO3_CONF_VARS']['DB']['Connections']['Default']['dbname'] = '$BRANCHERY_DATABASE';

    // Where this worktree answers, for a site configuration that asks for it.
    putenv('BRANCHERY_NAME=$BRANCHERY_NAME');
    putenv('BRANCHERY_HOST=$BRANCHERY_HOST');
    putenv('BRANCHERY_URL=$BRANCHERY_URL');

    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['trustedHostsPattern'] = '$BRANCHERY_HOSTS_PATTERN';
    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['sitename'] = '$BRANCHERY_NAME';

    // Development defaults
    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['displayErrors'] = 1;
    \$GLOBALS['TYPO3_CONF_VARS']['SYS']['devIPmask'] = '*';
    \$GLOBALS['TYPO3_CONF_VARS']['BE']['debug'] = true;
    \$GLOBALS['TYPO3_CONF_VARS']['FE']['debug'] = true;

    // Mail ends up in Mailpit (ddev mailpit)
    \$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport'] = 'smtp';
    \$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport_smtp_server'] = 'localhost:1025';
    \$GLOBALS['TYPO3_CONF_VARS']['MAIL']['transport_smtp_encrypt'] = false;
    PHP

# A worktree with no data to inherit: the application, installed into the empty
# database it was given. A failure here stops the operation -- what it leaves
# behind otherwise answers every request with an error.
setup:
  - |
    "$BRANCHERY_PHP" "$BRANCHERY_BIN/typo3" setup \
      --driver="$BRANCHERY_DB_DRIVER" --host="$BRANCHERY_DB_HOST" --port="$BRANCHERY_DB_PORT" \
      --username="$BRANCHERY_DB_USER" --password="$BRANCHERY_DB_PASSWORD" --dbname="$BRANCHERY_DATABASE" \
      --admin-username="$BRANCHERY_ADMIN_USER" --admin-user-password="$BRANCHERY_ADMIN_PASSWORD" \
      --admin-email="$BRANCHERY_ADMIN_EMAIL" \
      --project-name="$BRANCHERY_NAME" --create-site="$BRANCHERY_URL" \
      --server-type=apache --force --no-interaction

# Data written by another state of the code, fitted to this one.
migrate:
  - $BRANCHERY_PHP $BRANCHERY_BIN/typo3 extension:setup

# The last step of every operation that touches a worktree: a build, a data
# sync, a version switch, a bare reconfiguration.
finish:
  - $BRANCHERY_PHP $BRANCHERY_BIN/typo3 cache:flush
