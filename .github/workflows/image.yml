# The image is the add-on.
#
# A project installs a tag and pulls what it names, so the image is built here
# and nowhere else -- once per version, for both architectures a developer's
# machine is: half of them are Apple Silicon, and an image built for one of the
# two is an add-on that installs and then does not start.
name: image

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What a project installs is the tag the compose file names, and what a
      # release pushes is the tag on the commit. Both are written by hand; a
      # release that leaves the compose file on the version before installs
      # that one, and nothing else in this workflow would notice.
      - if: github.ref_type == 'tag'
        run: tools/check-compose-tag.sh "${{ github.ref_name }}"

      # arm64 is built through emulation. Slower than a runner of its own and
      # the only step of this that is; the alternative is two jobs and a
      # manifest written by hand.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A tag becomes the image's tag; a push to main becomes "main", which is
      # what the add-on is tried against before there is a version to call it.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch

      - uses: docker/build-push-action@v7
        with:
          context: ./branchery
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # What the running application says it is, and it is the name it was
          # pushed under: a tag for a release, "main" for the rolling build.
          # The page compares that with the image the project asks for, so the
          # two have to be the same string or a project tracking main would be
          # told for good that an update is waiting.
          build-args: |
            BRANCHERY_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A release is what says a version exists, and every project asks: the update
  # check reads the latest release and tells the developer to fetch it. So it is
  # created after the image has been pushed and never beside it -- a release
  # standing over a build that failed sends every project after an image that is
  # not there, which is the one failure this whole thing is built to avoid.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The whole history, because what the release says is the message of the
      # annotated tag and a shallow clone fetches no tag objects.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # One that is already there is left exactly as it is: re-running this
      # workflow is what happens after a failure somewhere else, and the only
      # thing rewriting the notes could achieve is undoing an edit somebody made
      # on the release page on purpose.
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "${TAG} is already released."
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "$(tools/release-notes.sh "${TAG}")" \
            --verify-tag
