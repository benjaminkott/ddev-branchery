name: branchery

ddev_version_constraint: '>= v1.24.0'

pre_install_actions:
  - |
    #ddev-description: Check the requirements
    # A file rather than a directory where the project is itself a worktree or a
    # submodule; git is there in both cases.
    if [ ! -e "${DDEV_APPROOT}/.git" ]; then
      echo "This add-on works with the project's repository, but none is checked out here."
      exit 1
    fi
  - |
    #ddev-description: Clear the way for the new version
    #
    # What an older Branchery installed and this one no longer does: the
    # application, its dependencies, the manual and the Dockerfile. They are in the
    # image now, and left here they would sit in the project for good.
    #
    # And the scripts, which are copied again right after: DDEV replaces a file
    # carrying its "#ddev-generated" line, but a script a release stops shipping is
    # one it never finds, and the entry point would go on calling it.
    #
    # Nothing else is touched. What this add-on still installs carries DDEV's own
    # line, and the state lives in var/ -- it is the project's, and it is what the
    # worktrees are made of.
    if [ -d "${DDEV_APPROOT}/.ddev/branchery" ]; then
      rm -rf "${DDEV_APPROOT}/.ddev/branchery/app" \
             "${DDEV_APPROOT}/.ddev/branchery/docs" \
             "${DDEV_APPROOT}/.ddev/branchery/scripts" \
             "${DDEV_APPROOT}/.ddev/branchery/Dockerfile" \
             "${DDEV_APPROOT}/.ddev/branchery/.dockerignore"

      # Whether this project had Branchery before can only be told here: the
      # directories the answer would be read from are made by the install itself,
      # further down.
      if [ -d "${DDEV_APPROOT}/.ddev/branchery/var/metadata" ]; then
        touch "${DDEV_APPROOT}/.ddev/branchery/.updating"
      fi
    fi

# What lands in the project's .ddev, and nothing besides. The application is
# not in this list -- it is the image the compose file names. What is left is
# what has to be a file in the project: what DDEV itself reads, and the scripts
# that run in the web container, which reaches them through /mnt/ddev_config.
#
# Everything listed here carries DDEV's "#ddev-generated" line, which is what
# lets a later "ddev add-on get" replace it and a removal take it away. A new
# shipped file without that line is one no update can reach.
project_files:
  - branchery/scripts/
  - commands/host/branchery
  - docker-compose.branchery.yaml

post_install_actions:
  - |
    #ddev-description: Reach the interface without the router
    # The router is what gives the interface a name and a certificate. A project
    # that omits it has neither and HTTP_EXPOSE is addressed to nobody, so the port
    # is mapped straight out of the container instead.
    #
    # Written where it is needed rather than shipped empty to everyone: a file in
    # somebody's repository that does nothing is a file they have to wonder about.
    # Removed again for a project that gained the router back.
    #
    # Both ports the compose file exposes, so the command and the note below open
    # the same address either way.
    norouter="${DDEV_APPROOT}/.ddev/docker-compose.branchery_norouter.yaml"
    if ( {{ contains "ddev-router" (list .DdevGlobalConfig.omit_containers | toString) }} ) \
      || ( {{ contains "ddev-router" (list .DdevProjectConfig.omit_containers | toString) }} ); then
      printf '#ddev-generated\nservices:\n  branchery:\n    ports:\n      - 8040:80\n      - 8041:80\n' > "${norouter}"
    elif [ -f "${norouter}" ] && grep -q 'ddev-generated' "${norouter}"; then
      rm -f "${norouter}"
    fi
  - |
    #ddev-description: Prepare the web server
    # Apache maps the addresses through VirtualDocumentRoot, which needs
    # mod_vhost_alias; under nginx a server block with a regex is enough.
    #
    # None of the three files this add-on writes into DDEV's own configuration
    # directories carries "#ddev-generated": that marker means DDEV wrote the file,
    # and it reports every foreign file bearing it as unexpected, in a block
    # printed on every command. They are removed by name when the add-on is.
    if [ "${DDEV_WEBSERVER_TYPE}" = "apache-fpm" ]; then
      mkdir -p "${DDEV_APPROOT}/.ddev/web-build"
      cat > "${DDEV_APPROOT}/.ddev/web-build/Dockerfile.branchery" <<'DOCKERFILE'
    # Written by Branchery. Rewritten on every install; edits do not survive.
    RUN a2enmod vhost_alias
    DOCKERFILE
    fi
  - |
    #ddev-description: Set Branchery up on container start
    mkdir -p "${DDEV_APPROOT}/.ddev/web-entrypoint.d"
    # A call and nothing else. This file is committed with the project, and logic
    # written into it would be a copy in every repository that installs Branchery.
    # What it calls is shipped beside the other scripts and travels with an update.
    cat > "${DDEV_APPROOT}/.ddev/web-entrypoint.d/branchery.sh" <<'ENTRYPOINT'
    #!/usr/bin/env bash
    # Written by Branchery. Rewritten on every install; edits do not survive.
    #
    # Sourced into DDEV's own start script, which stops the container at the first
    # command that fails -- so nothing here may fail and nothing may exit. A script
    # that is not there is a clone that has not installed the add-on yet.
    if [ -f /mnt/ddev_config/branchery/scripts/entrypoint.sh ]; then
        bash /mnt/ddev_config/branchery/scripts/entrypoint.sh \
            || echo "[branchery] The entry point failed; the worktrees may not be served. See above."
    else
        echo "[branchery] .ddev/branchery/scripts is missing. Run 'ddev add-on get benjaminkott/ddev-branchery' and 'ddev restart'."
    fi
    ENTRYPOINT
    chmod +x "${DDEV_APPROOT}/.ddev/web-entrypoint.d/branchery.sh"
  - |
    #ddev-description: Register the addresses
    # The one thing that cannot be shipped: DDEV substitutes nothing in a
    # config.*.yaml, so the project's own name has to be written in here. It also
    # has to be here and not in a compose file, because this is what makes DDEV
    # issue the certificate for the wildcard.
    cat > "${DDEV_APPROOT}/.ddev/config.branchery.yaml" <<CONFIG
    # Written by Branchery. Rewritten on every install; edits do not survive.
    # One wildcard covers every worktree: <worktree>.${DDEV_PROJECT}.${DDEV_TLD:-ddev.site}
    additional_hostnames:
        - "*.${DDEV_PROJECT}"
    CONFIG
  - |
    #ddev-description: Prepare the working directories
    mkdir -p "${DDEV_APPROOT}/.worktrees" \
             "${DDEV_APPROOT}/.ddev/branchery/var/metadata" \
             "${DDEV_APPROOT}/.ddev/branchery/var/docroots" \
             "${DDEV_APPROOT}/.ddev/branchery/var/jobs"

    # Working state: everything in these two, the rule for itself included.
    for directory in "${DDEV_APPROOT}/.worktrees" "${DDEV_APPROOT}/.ddev/branchery/var"; do
      if [ ! -f "${directory}/.gitignore" ]; then
        printf '%s\n' '# Created by Branchery. Generated state, not source.' '*' > "${directory}/.gitignore"
      fi
    done

    # The add-on's own directory. The scripts in it are add-on files like the
    # command and the compose file, and the entry point committed with the project
    # calls them by name -- so they are committed with it, or a clone starts
    # without them. What stays out of the history is the state, and this rule.
    #
    # Rewritten while it is still the one this add-on wrote: an earlier version
    # kept the scripts out as well.
    ignore="${DDEV_APPROOT}/.ddev/branchery/.gitignore"
    if [ ! -f "${ignore}" ] || grep -q 'Created by Branchery' "${ignore}"; then
      printf '%s\n' \
        '# Created by Branchery. Working state, not source.' \
        '/var/' \
        '/.gitignore' \
        > "${ignore}"
    fi
    chmod +x "${DDEV_APPROOT}/.ddev/commands/host/branchery" 2>/dev/null || true

    # An earlier version brought database servers of its own along. The worktrees
    # live on the project's own server now -- the one phpMyAdmin and "ddev
    # export-db" are already pointed at -- so both files have nothing left to say.
    # Only removed while they are still the ones this add-on wrote.
    for generated in "${DDEV_APPROOT}/.ddev/docker-compose.branchery-db.yaml" \
                     "${DDEV_APPROOT}/.ddev/branchery/databases.json"; do
      if [ -f "${generated}" ] && grep -q 'ddev-generated' "${generated}"; then
        rm -f "${generated}"
      fi
    done
    # Their data is left where it is: the volumes those containers wrote are yours
    # to remove with "docker volume rm" once none of it is wanted.

    # An earlier version installed "ddev wt" as a second command. Recognised by
    # what it does, so a command of that name belonging to someone else stays.
    legacy="${DDEV_APPROOT}/.ddev/commands/host/wt"
    if [ -f "${legacy}" ] && grep -q 'exec .*/branchery' "${legacy}"; then
      rm -f "${legacy}"
    fi

    # The same version wrote a settings file whose only setting was the namespace
    # of the addresses. Those follow the project name now. Removed only while it
    # says nothing else.
    settings="${DDEV_APPROOT}/.ddev/branchery.yaml"
    if [ -f "${settings}" ] && ! grep -qvE '^\s*(#.*)?$|^namespace:' "${settings}"; then
      rm -f "${settings}"
    fi

    # Nothing is written to the project's own .gitignore. The add-on's files follow
    # the DDEV convention and are committed with the project; what must not be
    # committed is working state, and each of those directories carries its own rule.
  - |
    #ddev-description: Note
    #
    # The application is an image, and what was installed here is the tag naming it.
    # A container is bound to the image it was made from, so the version this
    # project runs changes when the container is replaced -- which "restart" does.
    echo
    if [ -f "${DDEV_APPROOT}/.ddev/branchery/.updating" ]; then
      rm -f "${DDEV_APPROOT}/.ddev/branchery/.updating"
      echo "Branchery is updated. One command, or the container goes on running"
      echo "the version it already had:"
    else
      echo "Branchery is set up. One command:"
    fi
    echo
    echo "  ddev restart"
    echo
    echo "After that it is available at"
    # Without the router there is no name and no certificate: the port is mapped
    # straight out of the container, and the address is the plain one.
    if [ -f "${DDEV_APPROOT}/.ddev/docker-compose.branchery_norouter.yaml" ]; then
      echo "  http://127.0.0.1:8041"
    else
      echo "  https://${DDEV_PROJECT}.${DDEV_TLD:-ddev.site}:8041"
    fi
    echo "which 'ddev branchery launch' opens; 'ddev branchery' says what"
    echo "the same work looks like on the command line."

removal_actions:
  - |
    #ddev-description: Remove the generated files
    rm -f "${DDEV_APPROOT}/.ddev/web-build/Dockerfile.branchery" \
          "${DDEV_APPROOT}/.ddev/web-entrypoint.d/branchery.sh" \
          "${DDEV_APPROOT}/.ddev/config.branchery.yaml" \
          "${DDEV_APPROOT}/.ddev/docker-compose.branchery_norouter.yaml"
    # The scripts are taken by DDEV itself: they carry its line and are listed as
    # project files. What is named here is what an older Branchery installed beside
    # them. The state underneath is kept on purpose, and so is the image.
    rm -rf "${DDEV_APPROOT}/.ddev/branchery/app" \
           "${DDEV_APPROOT}/.ddev/branchery/docs" \
           "${DDEV_APPROOT}/.ddev/branchery/Dockerfile" \
           "${DDEV_APPROOT}/.ddev/branchery/.dockerignore"
    echo "The worktrees under ${DDEV_APPROOT}/.worktrees and their databases are kept."
